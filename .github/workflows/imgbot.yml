name: Optimize images
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  compress:
    if: github.event_name == 'pull_request' || contains(github.event.comment.body, '@imgbot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ImgBot opens a follow-up PR to compress new images without touching quality.
      - uses: imgbot/Imgbot@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
