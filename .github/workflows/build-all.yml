name: Build All Platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FED-USA-News-Android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fed-usa-news-android-debug
          path: FED-USA-News-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-electron:
    name: Build Electron Desktop App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FED-USA-News-Desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FED-USA-News-Desktop/package.json

      - name: Install Electron dependencies
        run: npm install

      - name: Build Linux Electron packages
        run: npm run dist:linux -- --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fed-usa-news-electron-linux
          path: |
            FED-USA-News-Desktop/dist/*.AppImage
            FED-USA-News-Desktop/dist/*.deb
          if-no-files-found: error
