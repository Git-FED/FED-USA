name: Manage stale issues
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: This issue has gone quiet for 60 days. If it's still relevant, comment and we'll reopen it. Otherwise it closes in 14 days.
          stale-pr-message: This PR has been idle for 30 days. If you're still working on it, comment. Otherwise it closes in 7 days.
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          exempt-issue-labels: pinned,security,editorial
          exempt-pr-labels: pinned,security
          exempt-all-milestones: true
          remove-stale-when-updated: true
